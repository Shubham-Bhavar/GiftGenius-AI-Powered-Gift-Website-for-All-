spring:
  application:
    name: giftgenius
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/giftgenius?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:giftgenius}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000   # ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

# Health, info and Prometheus metrics on a separate port that is never exposed through nginx.
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html

logging:
  level:
    com.giftgenius: ${LOG_LEVEL:INFO}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8081}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    refresh-reuse-grace: ${REFRESH_REUSE_GRACE:30s}
    password-reset-ttl: ${PASSWORD_RESET_TTL:30m}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:Strict}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  ai:
    enabled: ${AI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout: ${AI_TIMEOUT:12s}
  payment:
    razorpay-enabled: ${RAZORPAY_ENABLED:false}
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    razorpay-base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
  shipping:
    free-shipping-threshold: 999
    standard-fee: 49
    express-fee: 99
    same-day-fee: 149
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:GiftGenius Admin}
  rate-limit:
    ai-per-minute: ${RATE_LIMIT_AI:10}
    auth-per-minute: ${RATE_LIMIT_AUTH:20}
    public-per-minute: ${RATE_LIMIT_PUBLIC:30}
  orders:
    pending-payment-ttl: ${PENDING_PAYMENT_TTL:30m}
    max-pending-per-user: ${MAX_PENDING_ORDERS:3}
  mail:
    from: ${MAIL_FROM:GiftGenius <no-reply@giftgenius.local>}
  # Checkout "Use my current location": coordinates -> address, via OpenStreetMap Nominatim (no API key).
  geo:
    enabled: ${GEO_ENABLED:true}
    base-url: ${GEOCODER_BASE_URL:https://nominatim.openstreetmap.org}
    # Nominatim requires a User-Agent that identifies the app; defaults to "GiftGenius (+APP_PUBLIC_URL)".
    user-agent: ${GEOCODER_USER_AGENT:}
    timeout: ${GEOCODER_TIMEOUT:8s}

---
spring:
  config:
    activate:
      on-profile: dev
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    cookie-secure: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
logging:
  level:
    com.giftgenius: DEBUG
