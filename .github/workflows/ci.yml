name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + MySQL integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: giftgenius_test
          MYSQL_USER: giftgenius
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        env:
          IT_DB_URL: jdbc:mysql://127.0.0.1:3306/giftgenius_test?serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
          IT_DB_USERNAME: giftgenius
          IT_DB_PASSWORD: ci-password
        run: mvn -B verify -Pintegration

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp .env.example .env
          # Throw-away values for this run only: the API refuses to start without a JWT secret and an admin password.
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=ci-admin-$(openssl rand -hex 12)|" .env
          docker compose build
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          DOMAIN: ci.example.com
      # A built image isn't a working one: start the stack and check it the way a host would.
      - name: Start the stack and check it runs
        run: |
          docker compose up -d --wait --wait-timeout 300
          docker compose ps
          # The site and the API, through nginx.
          # Responses are captured first: `curl | grep -q` can fail under pipefail when grep stops reading early.
          page=$(curl -fsS http://localhost:8081/);                          grep -q '<div id="root">' <<<"$page"
          products=$(curl -fsS "http://localhost:8081/api/products?size=1"); grep -q '"content"' <<<"$products"
          headers=$(curl -fsSI http://localhost:8081/);                      grep -qi '^content-security-policy:' <<<"$headers"
          # Readiness answers inside the container; metrics stay refused without METRICS_SCRAPE_TOKEN (fail closed).
          ready=$(docker compose exec -T backend wget -qO- http://127.0.0.1:9091/actuator/health/readiness)
          grep -q '"UP"' <<<"$ready"
          if docker compose exec -T backend wget -qO- http://127.0.0.1:9091/actuator/prometheus; then
            echo "metrics answered without a token"; exit 1
          fi
          # The management port is never published.
          if docker compose port backend 9091 2>/dev/null | grep -q ':'; then echo "port 9091 is published"; exit 1; fi
      - name: Logs if the stack failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v --timeout 30
