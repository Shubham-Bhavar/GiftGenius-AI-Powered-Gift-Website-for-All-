# GiftGenius web server: serves the React build and proxies /api to Spring Boot on the same origin,
# so there is no CORS and the refresh cookie stays first-party.

# Real client IP. X-Forwarded-For is trusted ONLY from the edge proxy network (Caddy, see
# docker-compose.prod.yml). Everyone else gets their TCP peer address, so a client can't spoof its IP
# to dodge the backend's per-IP rate limits.
set_real_ip_from 172.30.0.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Keep https when TLS is terminated by the edge proxy.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers. Declared once at server level: a location with its own add_header would drop them.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.razorpay.com; frame-src https://*.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: the backend reads the first X-Forwarded-For entry as the client IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
  }

  # API docs, only when the backend runs with API_DOCS_ENABLED=true (otherwise the backend answers 404).
  location ~ ^/(v3/api-docs|swagger-ui)(/|\.html|$) {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Fingerprinted build output: cache for a year.
  location /assets/ {
    expires max;
    access_log off;
    try_files $uri =404;
  }

  # The app shell must always be revalidated so a deploy is picked up immediately.
  location = /index.html {
    expires -1;
  }

  # Client-side routes (/shop, /product/4, /account/orders/…) all load the app shell.
  location / {
    try_files $uri /index.html;
  }
}
